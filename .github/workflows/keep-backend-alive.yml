name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend to keep it alive..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://drop-it-backend.onrender.com/api/health)
          echo "Response code: $response"
          
          if [ $response -eq 200 ]; then
            echo "✅ Backend is alive and responding!"
          else
            echo "⚠️ Backend returned status code: $response"
          fi
      
      - name: Log Timestamp
        run: echo "Last ping at $(date)"
